<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迪迪桌面 · 三端发布中心</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1a2233;
    --muted: #697386;
    --line: #e4e9f2;
    --brand: #3563e9;
    --brand-soft: #eaf0ff;
    --accent: #12a37a;
    --shadow: 0 8px 28px rgba(30, 50, 90, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 56px; }
  header { padding: 52px 20px 30px; text-align: center; }
  .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 58px; height: 58px; border-radius: 16px;
    background: linear-gradient(135deg, #3563e9, #6d8bff);
    color: #fff; font-size: 26px; font-weight: 700;
    box-shadow: 0 8px 20px rgba(53, 99, 233, 0.28);
  }
  header h1 { margin: 16px 0 4px; font-size: 28px; letter-spacing: 1px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .badge {
    display: inline-block; margin-top: 14px; padding: 4px 12px;
    background: var(--brand-soft); color: var(--brand);
    border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 8px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 34px rgba(30, 50, 90, 0.12); }
  .card .tag {
    align-self: flex-start; font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 8px;
    background: #eef7f4; color: var(--accent);
  }
  .card .tag.phone { background: #fff3e8; color: #d97706; }
  .card .tag.remote { background: #f3ecff; color: #7c3aed; }
  .card h2 { margin: 14px 0 2px; font-size: 20px; }
  .card .ver { color: var(--brand); font-size: 13px; font-weight: 600; }
  .card .desc { color: var(--muted); font-size: 13px; min-height: 42px; margin: 12px 0; }
  .meta { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: auto; }
  .meta div { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 3px 0; }
  .meta span:first-child { color: var(--muted); }
  .meta span:last-child { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; word-break: break-all; }
  .download {
    display: block; margin-top: 18px; padding: 11px 0;
    background: var(--brand); color: #fff; text-decoration: none;
    border-radius: 10px; font-weight: 600; font-size: 14px; text-align: center;
    transition: background .15s ease;
  }
  .download:hover { background: #274fcc; }
  .notes {
    margin-top: 26px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px 24px; box-shadow: var(--shadow);
  }
  .notes h3 { margin: 0 0 10px; font-size: 15px; }
  .notes ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13px; }
  .notes li { padding: 3px 0; }
  .notes code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 4px;
  }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">迪</div>
    <h1>迪迪桌面</h1>
    <p>DidiLauncher · 三端统一发布中心</p>
    <span class="badge" id="badge">正在读取版本…</span>
  </header>

  <main>
    <div class="grid" id="grid">
      <article class="card">
        <span class="tag">车机桌面</span>
        <h2>迪迪桌面</h2>
        <div class="ver">读取中</div>
        <div class="desc">正在读取发布数据…</div>
      </article>
    </div>

    <section class="notes">
      <h3>安装说明</h3>
      <ul>
        <li>三端均为正式签名构建，同一密钥的旧版本可直接覆盖安装。</li>
        <li>新包名 <code>com.didi.*</code> 不会覆盖旧的 <code>com.byd.dilink.launcher</code>，需按新应用安装。</li>
        <li>首次安装车机桌面后，请使用「设为默认桌面」功能，在系统页面选择迪迪桌面。</li>
        <li>点击下载即可获取安装包，无需输入任何校验码。</li>
      </ul>
    </section>
  </main>

  <footer>DidiLauncher · 三端发布页</footer>
</div>

<script>
(function () {
  var TAGS = { carremote: "remote", remote: "phone" };

  function esc(raw) {
    return String(raw == null ? "" : raw).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtSize(bytes) {
    if (!bytes) return "—";
    var mb = bytes / 1048576;
    return (mb >= 100 ? mb.toFixed(0) : mb.toFixed(1)) + " MB";
  }

  function card(app) {
    var tagClass = TAGS[app.key] ? "tag " + TAGS[app.key] : "tag";
    return '<article class="card">' +
      '<span class="' + tagClass + '">' + esc(app.role) + '</span>' +
      '<h2>' + esc(app.name) + '</h2>' +
      '<div class="ver">v' + esc(app.versionName) + ' · versionCode ' + esc(app.versionCode) + '</div>' +
      '<div class="desc">' + esc(app.desc) + '</div>' +
      '<div class="meta">' +
        '<div><span>包名</span><span>' + esc(app.pkg) + '</span></div>' +
        '<div><span>文件</span><span>' + esc(app.apk) + '</span></div>' +
      '</div>' +
      '<a class="download" href="' + esc(app.downloadUrl) + '">下载 APK</a>' +
    '</article>';
  }

  function load() {
    fetch("meta.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (meta) {
      var apps = (meta && meta.apps) || [];
      if (!apps.length) {
        document.getElementById("grid").innerHTML =
          '<article class="card"><span class="tag">暂无数据</span><h2>读取失败</h2>' +
          '<div class="desc">清单文件缺失，请刷新重试。</div></article>';
        document.getElementById("badge").textContent = "发布数据不可用";
        return;
      }
      document.getElementById("grid").innerHTML = apps.map(card).join("");
      var main = apps[0];
      document.getElementById("badge").textContent =
        "最新版本 v" + main.versionName + " · 正式签名 · 三端同步发布";
    }).catch(function () {
      document.getElementById("grid").innerHTML =
        '<article class="card"><span class="tag">离线</span><h2>读取失败</h2>' +
        '<div class="desc">无法读取发布数据，请刷新重试。</div></article>';
      document.getElementById("badge").textContent = "离线";
    });
  }

  load();
})();
</script>
</body>
</html>
